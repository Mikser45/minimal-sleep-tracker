<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Minimal Sleep Tracker</title>
<style>
/* =====================================================================
   MINIMAL SLEEP TRACKER
   Single-file, offline sleep tracker. All data lives in localStorage.

   THEME COLORS
   Change the palette here. ":root" is the Light theme,
   [data-theme="dark"] is the Dark theme.
   ===================================================================== */
:root {
  --bg: #FFFFFF;              /* page background */
  --surface: #FFFFFF;         /* cards, sheet, tab bar */
  --surface-2: #F2F4F8;       /* subtle fills: segmented controls, placeholders */
  --surface-3: #E6EAF0;       /* inactive faces */
  --border: #E2E7EE;          /* card borders, dividers */
  --border-strong: #CBD3DE;   /* inputs, outline buttons */
  --text: #141E30;            /* main text */
  --text-2: #526077;          /* secondary text */
  --text-3: #7A8599;          /* hints, axis labels */
  --accent: #141E30;          /* buttons, active states, "goal met" bars (blue-black) */
  --accent-hover: #26344D;
  --accent-soft: #D3D8DF;     /* "below goal" bars (cool grey) */
  --accent-tint: #F1F3F6;     /* banner, selected face, More details background */
  --on-accent: #FFFFFF;       /* text on accent */
  --focus-ring: rgba(20, 30, 48, .12); /* glow around focused inputs */
  --danger: #B03A2E;          /* errors, destructive actions, overdue backup */
  --danger-tint: #FBEDEB;
  --on-danger: #FFFFFF;
  --warning: #8A5A0B;         /* soft warnings (e.g. over 16 hours) */
  --grid: #E9EDF2;            /* chart grid lines */
  --row: #F4F6F9;             /* Sleep Timeline row background */
  /* Sleep quality colors: 1 Very Poor ... 5 Excellent */
  --q1: #C9705F;
  --q2: #DB9A5E;
  --q3: #D1B65C;
  --q4: #82AD8E;
  --q5: #4F8F7B;
  --face-ink: #141E30;        /* eyes and mouth on faces */
  /* Factor dot colors (History), in the order factors are listed */
  --f1: #5B7FA8; --f2: #B0705F; --f3: #C29A45; --f4: #6E9C7E;
  --f5: #8A6FA8; --f6: #4F9AA0; --f7: #B5728F; --f8: #7D8A9C;

  --shadow: 0 1px 2px rgba(20, 30, 48, .04), 0 2px 10px rgba(20, 30, 48, .04);
  --radius: 16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #141E30;
  --surface: #1A2539;
  --surface-2: #212E46;
  --surface-3: #2B3A54;
  --border: #2B3A55;
  --border-strong: #3D4F6E;
  --text: #EAF0F8;
  --text-2: #B1BDD0;
  --text-3: #8592A9;
  --accent: #86A9D2;          /* #35577D lightened for contrast on navy */
  --accent-hover: #9DBADD;
  --accent-soft: #46628B;
  --accent-tint: #22324D;
  --on-accent: #0F1828;
  --focus-ring: rgba(134, 169, 210, .25);
  --danger: #F0907F;
  --danger-tint: #3A2531;
  --on-danger: #1A0F12;
  --warning: #E9B860;
  --grid: #27344C;
  --row: #1F2A40;
  --q1: #E08C7C;
  --q2: #E8AE76;
  --q3: #DCC77A;
  --q4: #97C3A3;
  --q5: #6FB39D;
  --face-ink: #141E30;
  --f1: #86A9D2; --f2: #E09C8C; --f3: #E2C277; --f4: #97C3A3;
  --f5: #B6A0D4; --f6: #7CC3C8; --f7: #DDA0BB; --f8: #A9B5C7;
  --shadow: none;
  color-scheme: dark;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
#main { overflow-anchor: none; } /* views are re-rendered in place; the app restores scroll itself */
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; }

/* App column: phone-first, centered on wider screens */
.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px calc(104px + env(safe-area-inset-bottom));
}

/* ===== Headers ===== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0 6px;
}
.app-title { font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
.page-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 20px 0 14px; }

/* ===== Buttons ===== */
.icon-btn {
  width: 44px; height: 44px; border: 0; background: transparent;
  border-radius: 12px; display: inline-grid; place-items: center;
  color: var(--text-2); flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.sm { width: 36px; height: 36px; }
.icon-btn.sm svg { width: 18px; height: 18px; }

.btn {
  min-height: 44px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--border-strong); background: var(--surface);
  font-weight: 600; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s, border-color .15s, color .15s;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
.btn-danger:hover { filter: brightness(.95); background: var(--danger); }
.btn-danger-outline { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn-danger-outline:hover { background: var(--danger-tint); }
.btn-xl { width: 100%; min-height: 56px; font-size: 17px; border-radius: 16px; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn-block { width: 100%; }
.link-btn {
  border: 0; background: none; padding: 6px 2px; color: var(--accent);
  font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
}

/* ===== Cards ===== */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  margin-bottom: 12px;
}
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.card h2 { font-size: 15px; font-weight: 650; }
.card-sub { font-size: 13px; color: var(--text-3); }

/* ===== Banners ===== */
.banner {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px;
  background: var(--accent-tint); border: 1px solid var(--border);
  border-radius: 14px; padding: 10px 10px 10px 14px; margin: 6px 0 8px; font-size: 14px; font-weight: 500;
}
.reminder {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  font-size: 14px; color: var(--text-2);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 2px 2px 2px 12px; margin: 6px 0 8px;
}
.reminder .reminder-text { flex: 1; min-width: 0; }

/* ===== Home ===== */
.hero { text-align: center; padding: 28px 0 24px; }
.hero-label { font-size: 14px; color: var(--text-2); font-weight: 500; }
.hero-value {
  font-size: 64px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05;
  margin: 6px 0 10px; font-variant-numeric: tabular-nums;
}
.hero-compare { font-size: 16px; color: var(--text-2); font-weight: 500; }
.hero-compare.met { color: var(--accent); }
.hero-meta { margin-top: 8px; font-size: 14px; color: var(--text-3); }
.home-week { margin-top: 16px; }

.empty-hero { text-align: center; padding: 48px 8px 8px; }
.empty-icon {
  width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;
  background: var(--accent-tint); color: var(--accent); display: grid; place-items: center;
}
.empty-icon svg { width: 30px; height: 30px; }
.empty-hero h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.empty-hero p { color: var(--text-2); margin: 8px auto 24px; max-width: 320px; }

/* ===== Segmented control ===== */
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
  background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 12px;
}
.seg button {
  border: 0; background: none; min-height: 40px; border-radius: 9px;
  font-weight: 600; font-size: 14px; color: var(--text-2); padding: 0 10px;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(20, 30, 48, .1); }
[data-theme="dark"] .seg button.on { background: var(--surface-3); }
.seg.inline { display: inline-grid; margin: 0; }

/* ===== KPIs ===== */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.kpi { margin: 0; }
.kpi-label { font-size: 13px; color: var(--text-2); font-weight: 600; }
.kpi-value {
  font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px;
  font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; line-height: 1.2;
}
.kpi-value.small { font-size: 20px; }
.kpi-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

/* ===== Charts ===== */
.chart { width: 100%; }
.chart svg { display: block; overflow: visible; }
.chart text { font-size: 10.5px; fill: var(--text-3); font-family: var(--font); }
.chart text.val { fill: var(--text-2); font-weight: 600; stroke: var(--surface); stroke-width: 3px; paint-order: stroke; stroke-linejoin: round; }
.chart text.goal-label { fill: var(--text-2); font-weight: 600; }
.chart text.tl-today { fill: var(--accent); font-weight: 700; }
.chart.timeline text { font-size: 9.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12.5px; color: var(--text-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sw-dash { width: 16px; height: 0; border-top: 2px dashed var(--text-2); display: inline-block; }
.placeholder {
  padding: 28px 12px; text-align: center; color: var(--text-3); font-size: 14px;
  background: var(--surface-2); border-radius: 12px;
}

.month-switch { display: flex; align-items: center; gap: 2px; }
.month-switch strong { font-size: 14px; font-weight: 600; min-width: 74px; text-align: center; }
.month-switch .icon-btn:disabled { opacity: .3; cursor: default; background: none; }
.tl-empty { font-size: 13px; color: var(--text-3); margin: 8px 0 0; text-align: center; }

.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stat-value { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat-label { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

/* Quality breakdown bar */
.qbar { display: flex; height: 28px; border-radius: 8px; overflow: hidden; gap: 2px; }
.qbar span { display: block; height: 100%; min-width: 3px; }
.qlegend { display: grid; grid-template-columns: 1fr; gap: 8px 16px; margin: 14px 0 0; padding: 0; list-style: none; }
.qlegend li { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.qlegend .qcount { white-space: nowrap; margin-left: auto; color: var(--text-3); font-variant-numeric: tabular-nums; }
.qlegend svg { width: 18px; height: 18px; flex: none; }

/* Factors (Patterns) */
.frow { padding: 12px 0; border-top: 1px solid var(--border); }
.frow:first-of-type { border-top: 0; padding-top: 2px; }
.frow-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 600; font-size: 14.5px; }
.fdiff { color: var(--text-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
.fbar { display: grid; grid-template-columns: 58px 1fr 58px; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); margin-top: 7px; }
.fbar b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
.ftrack { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.ftrack i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.ftrack.without i { background: var(--accent-soft); }
.fnote { font-size: 12.5px; color: var(--text-3); margin: 6px 0 0; }

/* ===== History ===== */
.hist-meta { color: var(--text-3); font-size: 14px; margin: -8px 0 12px; }
.factor-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-2); margin-bottom: 4px; }
.factor-legend span { display: inline-flex; align-items: center; gap: 6px; }
.month-group h2 {
  font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3);
  font-weight: 700; margin: 20px 4px 8px;
}
.hist-list {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow);
}
.hist-row {
  display: grid; grid-template-columns: 1fr auto 28px; align-items: center; gap: 12px;
  width: 100%; text-align: left; padding: 12px 14px; border: 0; background: none;
  border-top: 1px solid var(--border); min-height: 64px;
}
.hist-row:first-child { border-top: 0; }
.hist-row:hover { background: var(--surface-2); }
.hist-date { font-weight: 600; font-size: 15px; }
.hist-times { font-size: 13px; color: var(--text-3); margin-top: 1px; }
.hist-dur { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.hist-row svg.face { width: 26px; height: 26px; }
.dots { display: flex; gap: 4px; margin-top: 5px; }
.fdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* ===== Forms ===== */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .block-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.input {
  min-height: 48px; border: 1px solid var(--border-strong); border-radius: 12px;
  background: var(--surface); padding: 0 12px; width: 100%; font-size: 16px; min-width: 0;
}
.input:hover { border-color: var(--text-3); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
.input.invalid { border-color: var(--danger); }
input[type="time"].input, input[type="date"].input { -webkit-appearance: none; appearance: none; display: block; text-align: left; }
input[type="time"]::-webkit-date-and-time-value, input[type="date"]::-webkit-date-and-time-value { text-align: left; }
textarea.input { padding: 12px; min-height: 84px; resize: vertical; line-height: 1.4; }
.err { color: var(--danger); font-size: 13px; font-weight: 500; }
.err:empty { display: none; }
.warn { color: var(--warning); font-size: 13.5px; font-weight: 500; text-align: center; }
.warn:empty { display: none; }
.hint { font-size: 13px; color: var(--text-3); margin: 0; }
.opt { font-weight: 500; color: var(--text-3); font-size: 12px; margin-left: 4px; }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; flex: none; }
.stepper button { width: 46px; height: 46px; border: 0; background: var(--surface-2); font-size: 22px; line-height: 1; color: var(--text); }
.stepper button:hover { background: var(--surface-3); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 80px; text-align: center; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.stepper output.muted { color: var(--text-3); }

/* ===== Bottom tab bar ===== */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 560px; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; min-height: 54px; color: var(--text-3); font-size: 11px; font-weight: 600; border-radius: 12px;
}
.tab:hover { color: var(--text); }
.tab svg { width: 24px; height: 24px; }
.tab.active { color: var(--accent); }
.tab-plus .plus {
  width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; margin-top: -20px; box-shadow: 0 4px 14px rgba(20, 30, 48, .18);
  transition: background .15s;
}
.tab-plus:hover .plus { background: var(--accent-hover); }
.tab-plus .plus svg { width: 26px; height: 26px; }

.more-menu {
  position: fixed; z-index: 25;
  bottom: calc(76px + env(safe-area-inset-bottom));
  right: max(12px, calc(50% - 268px));
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 8px 28px rgba(10, 16, 28, .16); padding: 6px; min-width: 190px;
}
.more-menu button {
  display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none;
  padding: 0 12px; min-height: 48px; border-radius: 10px; font-weight: 600; font-size: 15px; text-align: left;
}
.more-menu button:hover { background: var(--surface-2); }
.more-menu button.active { color: var(--accent); }
.more-menu svg { width: 20px; height: 20px; color: var(--text-2); }

/* ===== Bottom sheet (Log Sleep) ===== */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(10, 16, 28, .38); opacity: 0; transition: opacity .22s; }
.sheet {
  position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 100%);
  width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
  transition: transform .26s cubic-bezier(.2, .8, .2, 1);
}
.sheet:focus { outline: none; }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: translate(-50%, 0); }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 2px auto 10px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 14px; }
.sheet-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.night-of {
  border: 0; background: none; padding: 4px 0; margin-top: 2px; color: var(--text-2);
  font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;
}
.night-of:hover { color: var(--text); }
.night-of svg { width: 16px; height: 16px; transition: transform .15s; }
.night-of[aria-expanded="true"] svg { transform: rotate(180deg); }
.date-field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
.time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.duration { text-align: center; margin: 14px 0 4px; }
.duration-label { display: block; font-size: 12.5px; color: var(--text-3); font-weight: 600; }
.duration strong { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.field-block { margin-top: 16px; }
.field-block .block-label { margin-bottom: 8px; display: block; }
.qrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.qbtn {
  border: 1px solid transparent; background: none; border-radius: 14px; padding: 8px 0 6px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 11.5px; line-height: 1.15; color: var(--text-3); font-weight: 600; min-width: 0;
}
.qbtn:hover { background: var(--surface-2); }
.qbtn svg { width: 42px; height: 42px; }
.qbtn.on { background: var(--accent-tint); border-color: var(--accent); color: var(--text); }
.qbtn:not(.on) .face-bg { fill: var(--surface-3); }
.qbtn:not(.on) .face-eye { fill: var(--text-3); }
.qbtn:not(.on) .face-mouth { stroke: var(--text-3); }
/* "More details": a visible row that opens the optional fields */
.details-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  margin-top: 18px; padding: 10px 14px; min-height: 60px;
  border: 1px solid var(--border-strong); border-radius: 14px; background: var(--surface-2);
  color: var(--text); text-align: left; transition: background .15s, border-color .15s;
}
.details-toggle:hover { border-color: var(--accent); background: var(--accent-tint); }
.details-toggle[aria-expanded="true"] { border-radius: 14px 14px 0 0; border-bottom-color: transparent; background: var(--accent-tint); }
.details-title { display: block; font-weight: 650; font-size: 15.5px; }
.details-sub { display: block; font-size: 13px; color: var(--text-2); margin-top: 1px; }
.details-count { color: var(--accent); font-weight: 600; }
.details-chev {
  width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); color: var(--accent); border: 1px solid var(--border);
}
.details-chev svg { width: 18px; height: 18px; transition: transform .15s; }
.details-toggle[aria-expanded="true"] .details-chev svg { transform: rotate(180deg); }
.details {
  display: flex; flex-direction: column; gap: 16px; padding: 14px 14px 16px;
  border: 1px solid var(--border-strong); border-top: 0; border-radius: 0 0 14px 14px;
}
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-strong);
  background: var(--surface); font-size: 14px; font-weight: 600; color: var(--text-2);
}
.chip:hover { border-color: var(--text-3); color: var(--text); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.sheet-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

/* ===== Settings ===== */
.sec-title { font-size: 15px; font-weight: 650; margin-bottom: 4px; }
.setting { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px 16px; padding: 12px 0; border-top: 1px solid var(--border); }
.card > .setting:first-of-type { border-top: 0; padding-top: 6px; }
.setting-label { font-weight: 600; font-size: 15px; }
.setting-hint { font-size: 13px; color: var(--text-3); margin: 2px 0 0; }
.inline-row { display: flex; align-items: center; gap: 10px; }
.input-time { width: 150px; }
.factor-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.factor-list li { display: grid; grid-template-columns: 10px 1fr 44px; align-items: center; gap: 4px 10px; }
.factor-list li .err { grid-column: 2 / 4; }
.factor-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
#ferr-new { margin-top: 6px; }
.data-warning { font-size: 14px; color: var(--text-2); margin: 0 0 14px; line-height: 1.5; }
.data-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 12px; }
.backup-status { font-size: 16px; font-weight: 700; }
.backup-status.overdue { color: var(--danger); }
.divider { border: 0; border-top: 1px solid var(--border); margin: 18px 0 14px; }
.erase-text { font-size: 13.5px; color: var(--text-2); margin: 0 0 10px; }
.version-note { text-align: center; color: var(--text-3); font-size: 12.5px; margin: 16px 0 0; }

/* ===== Guide ===== */
.guide h2 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.guide h3 { font-size: 14.5px; font-weight: 650; margin: 14px 0 4px; }
.guide p, .guide li { color: var(--text-2); font-size: 15px; line-height: 1.55; }
.guide p { margin: 0 0 10px; }
.guide ul, .guide ol { margin: 0 0 10px; padding-left: 20px; }
.guide li { margin-bottom: 4px; }
.guide strong { color: var(--text); font-weight: 600; }
.note-box { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--text-2); margin-top: 8px; }

/* ===== Onboarding (after Clear Demo Data / Erase) ===== */
.onboard { text-align: center; padding: 56px 4px 24px; max-width: 420px; margin: 0 auto; }
.onboard h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.onboard > p { color: var(--text-2); margin: 10px 0 28px; }
.onboard .stepper { margin-bottom: 28px; }
.onboard .stepper button { width: 56px; height: 56px; }
.onboard .stepper output { min-width: 110px; font-size: 22px; }
.onboard .field { text-align: left; margin-bottom: 6px; }
.onboard .hint { text-align: left; margin-bottom: 28px; }

/* ===== Dialog ===== */
.dialog-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; }
.dialog-backdrop { position: absolute; inset: 0; background: rgba(10, 16, 28, .45); }
.dialog {
  position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 16px 40px rgba(10, 16, 28, .25);
}
.dialog h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.dialog p { color: var(--text-2); margin: 0 0 18px; font-size: 15px; }
.dialog-actions { display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: 8px; }
.dialog-actions .btn { flex: 1 1 auto; }

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 70;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px;
  font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); text-align: center;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== Small phones ===== */
@media (max-width: 380px) {
  .hero-value { font-size: 56px; }
  .kpi-value { font-size: 23px; }
  .qbtn { font-size: 10.5px; }
  .qbtn svg { width: 38px; height: 38px; }
}
/* ===== Wider screens: same centered column, a little more air ===== */
@media (min-width: 600px) {
  .tabbar { border-left: 1px solid var(--border); border-right: 1px solid var(--border); border-radius: 18px 18px 0 0; }
  .page-head h1 { margin-top: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

<div class="app">
  <main id="main"></main>
</div>

<!-- Bottom navigation -->
<nav class="tabbar" id="tabbar" aria-label="Main">
  <button class="tab" data-action="go" data-view="home" data-tab="home"><span data-icon="home"></span>Home</button>
  <button class="tab" data-action="go" data-view="trends" data-tab="trends"><span data-icon="trends"></span>Trends</button>

<!-- "More" menu -->

  <button role="menuitem" data-action="go" data-view="history"><span data-icon="history"></span>History</button>
  <button role="menuitem" data-action="go" data-view="settings"><span data-icon="gear"></span>Settings</button>
